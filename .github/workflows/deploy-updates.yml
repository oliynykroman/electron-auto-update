name: Публікація демо-оновлення

on:
  push:
    branches: [main]
    paths:
      - "updates/**"
      - ".github/workflows/deploy-updates.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Отримання репозиторію
        uses: actions/checkout@v4

      - name: Налаштування GitHub Pages
        uses: actions/configure-pages@v5

      - name: Завантаження каталогу updates
        uses: actions/upload-pages-artifact@v3
        with:
          path: updates

      - name: Публікація
        id: deployment
        uses: actions/deploy-pages@v4
